<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="theme-color" content="#d8e0cf"/>
  <meta name="description" content="开着小车，探索陈飞扬的 AI 产品、科研工具与模拟世界。"/>
  <title>岛屿设置 · skeleton 的花园</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <style>
    #garden-boot{position:relative;z-index:100;padding:20px 24px;background:#263d31;color:#faf7ed;font:14px/1.7 system-ui,sans-serif}
    #garden-boot[hidden]{display:none}
    #garden-boot p{margin:0 0 8px}#garden-boot strong{font-size:18px}
    #garden-boot button{padding:9px 16px;border:1px solid #b4c5a9;border-radius:24px;background:#faf7ed;color:#263d31;cursor:pointer;font:inherit}
    #garden-boot details{margin-top:12px;font-size:12px}#garden-boot pre{white-space:pre-wrap;overflow-wrap:anywhere}
  </style>
  <script>
    // This classic script must work even when the application module cannot load.
    (function () {
      var mounted = false, failure = '', timer;
      function show(message) {
        var panel = document.getElementById('garden-boot');
        if (!panel || mounted) return;
        panel.hidden = false;
        document.getElementById('garden-boot-message').textContent = message;
        document.getElementById('garden-boot-detail').textContent = '版本：2026-09-16.2\n' + (failure || '等待互动页面启动') + '\n' + navigator.userAgent;
      }
      window.addEventListener('error', function (event) {
        if (mounted) return;
        var target = event.target;
        if (target && target.tagName === 'SCRIPT') failure = '脚本下载失败：' + target.src;
        else if (event.message) failure = event.message;
        else return;
        show('互动花园暂时未能打开。请重试，或先浏览下方作品。');
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        if (mounted) return;
        failure = String(event.reason && event.reason.message || event.reason || '启动失败');
        show('互动花园暂时未能打开。请重试，或先浏览下方作品。');
      });
      window.addEventListener('garden:app-ready', function () {
        mounted = true;
        clearTimeout(timer);
        var panel = document.getElementById('garden-boot');
        if (panel) panel.hidden = true;
      });
      document.addEventListener('click', function (event) {
        if (event.target && event.target.id === 'garden-boot-retry') {
          var url = new URL(location.href);
          url.searchParams.set('reload', String(Date.now()));
          location.replace(url.href);
        }
      });
      document.addEventListener('DOMContentLoaded', function () {
        if (failure) show('互动花园暂时未能打开。请重试，或先浏览下方作品。');
      });
      // A pending module download also delays DOMContentLoaded.
      timer = setTimeout(function () { show('花园还在加载。你可以继续等待、重新加载，或先浏览下方作品。'); }, 8000);
    }());
  </script>
  <script type="module" crossorigin src="/assets/index-DpasaeeI.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-D5Q5i5Wb.css">
</head>
<body>
  <aside id="garden-boot" hidden aria-live="polite">
    <p><strong>skeleton 的花园</strong></p>
    <p id="garden-boot-message"></p>
    <button id="garden-boot-retry" type="button">重新加载花园</button>
    <details><summary>查看加载信息</summary><pre id="garden-boot-detail"></pre></details>
  </aside>
  <noscript><p>开启浏览器的 JavaScript 后就能进入互动花园，也可以直接阅读下方作品。</p></noscript>
  <div id="root"><main class="static-content"><a href="/">skeleton 的花园</a><h1>按你喜欢的方式。</h1><p>光线、声音、车身颜色与画质设置需要 JavaScript。你也可以直接阅读作品。</p><a href="/projects/">浏览全部作品</a></main></div>
</body>
</html>
